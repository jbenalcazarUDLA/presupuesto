<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planificador de Presupuesto — Sprint 1</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f6f8;color:#1f2937}.wrap{max-width:1200px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.title h1{margin:0;font-size:26px}.title p{margin:6px 0 0;color:#667085}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:600;cursor:pointer}.primary{background:#1769aa;color:white}.secondary{background:white;border:1px solid #d0d5dd}.danger{background:#fff1f0;color:#b42318}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.card{background:white;border:1px solid #e4e7ec;border-radius:10px;padding:18px}.label{font-size:13px;color:#667085}.value{font-size:25px;font-weight:700;margin-top:5px}.panel{background:white;border:1px solid #e4e7ec;border-radius:10px;padding:18px}.toolbar{display:flex;gap:10px;justify-content:space-between;margin-bottom:14px}.search{width:320px;padding:10px 12px;border:1px solid #d0d5dd;border-radius:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #eaecf0;font-size:14px}.table th{background:#f9fafb;color:#475467}.pill{padding:4px 8px;border-radius:99px;font-size:12px}.on{background:#ecfdf3;color:#027a48}.off{background:#f2f4f7;color:#475467}.actions button{margin-right:6px;padding:6px 9px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center}.modal.open{display:flex}.box{background:white;width:min(520px,92vw);border-radius:12px;padding:22px}.box h2{margin-top:0}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.check{display:flex;gap:8px;align-items:center}.footer{margin-top:16px;color:#667085;font-size:12px}@media(max-width:750px){.cards{grid-template-columns:1fr}.toolbar{flex-direction:column}.search{width:100%}.table{display:block;overflow:auto}}
</style></head><body><div class="wrap"><div class="top"><div class="title"><h1>Planificador de Presupuesto</h1><p>SPRINT 1 · Administración de cuentas</p></div><button class="btn primary" onclick="openNew()">+ Nueva cuenta</button></div><div class="cards"><div class="card"><div class="label">Total cuentas</div><div class="value" id="total">0</div></div><div class="card"><div class="label">Cuentas activas</div><div class="value" id="active">0</div></div><div class="card"><div class="label">Persistencia</div><div class="value" style="font-size:18px">Local</div></div></div><div class="panel"><div class="toolbar"><input id="search" class="search" placeholder="Buscar por código, cuenta o departamento" oninput="render()"><button class="btn secondary" onclick="resetData()">Restaurar cuentas iniciales</button></div><table class="table"><thead><tr><th>Código</th><th>Cuenta</th><th>Departamento</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table><div class="footer">Los cambios se guardan automáticamente en el navegador de esta laptop mediante almacenamiento local.</div></div></div>
<div id="modal" class="modal"><div class="box"><h2 id="modalTitle">Nueva cuenta</h2><input type="hidden" id="id"><div class="field"><label>Código</label><input id="code" maxlength="30" placeholder="Ej. 00282239"></div><div class="field"><label>Nombre de la cuenta *</label><input id="name" maxlength="150"></div><div class="field"><label>Departamento</label><input id="department" value="TECNOLOGIA"></div><div class="field check"><input id="active" type="checkbox" checked><label for="active">Cuenta activa</label></div><div style="display:flex;justify-content:flex-end;gap:10px"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="save()">Guardar</button></div></div></div>
<script>
const initial=[['00282239','Alquiler de equipos de computación'],['00306193','Alquiler software'],['00271699','Comunicaciones'],['','Honorarios profesionales personas'],['','Honorarios profesionales sociedades'],['00271698','Internet'],['00276190','Mantenimiento equipos de cómputo'],['00313131','Mantenimiento software'],['00334985','Renovación soporte licencias'],['00271770','Útiles de computación'],['','Equipos ergómicos'],['00361703','Viáticos: Alimentación'],['00361702','Viáticos: Hospedaje'],['00361704','Viáticos: Movilización'],['00361705','Viáticos: Pasajes aéreos'],['','Ciberseguridad (NUEVO)']].map((x,i)=>({id:i+1,code:x[0],name:x[1],department:'TECNOLOGIA',active:true}));
const KEY='planificador_presupuesto_sprint1_accounts';let accounts=JSON.parse(localStorage.getItem(KEY)||'null');if(!accounts){accounts=initial;persist()}
function persist(){localStorage.setItem(KEY,JSON.stringify(accounts))}function render(){let q=document.getElementById('search').value.toLowerCase().trim();let a=accounts.filter(x=>(x.code+' '+x.name+' '+x.department).toLowerCase().includes(q)).sort((a,b)=>(b.active-a.active)||a.name.localeCompare(b.name));document.getElementById('total').textContent=accounts.length;document.getElementById('active').textContent=accounts.filter(x=>x.active).length;document.getElementById('rows').innerHTML=a.map(x=>`<tr><td>${esc(x.code||'—')}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.department||'')}</td><td><span class="pill ${x.active?'on':'off'}">${x.active?'Activa':'Inactiva'}</span></td><td class="actions"><button class="btn secondary" onclick="edit(${x.id})">Editar</button><button class="btn danger" onclick="toggle(${x.id})">${x.active?'Desactivar':'Activar'}</button></td></tr>`).join('')}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function openNew(){document.getElementById('modalTitle').textContent='Nueva cuenta';document.getElementById('id').value='';document.getElementById('code').value='';document.getElementById('name').value='';document.getElementById('department').value='TECNOLOGIA';document.getElementById('active').checked=true;document.getElementById('modal').classList.add('open')}function edit(id){let x=accounts.find(a=>a.id===id);document.getElementById('modalTitle').textContent='Editar cuenta';document.getElementById('id').value=x.id;document.getElementById('code').value=x.code||'';document.getElementById('name').value=x.name;document.getElementById('department').value=x.department||'';document.getElementById('active').checked=x.active;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function save(){let id=Number(document.getElementById('id').value),code=document.getElementById('code').value.trim(),name=document.getElementById('name').value.trim(),department=document.getElementById('department').value.trim()||'TECNOLOGIA',active=document.getElementById('active').checked;if(!name){alert('El nombre de la cuenta es obligatorio.');return}if(code&&accounts.some(x=>x.code===code&&x.id!==id)){alert('El código de cuenta ya existe.');return}if(id){Object.assign(accounts.find(x=>x.id===id),{code,name,department,active})}else{accounts.push({id:Date.now(),code,name,department,active})}persist();closeModal();render()}function toggle(id){let x=accounts.find(a=>a.id===id);x.active=!x.active;persist();render()}function resetData(){if(confirm('Esto reemplazará las cuentas actuales por las 16 cuentas iniciales. ¿Continuar?')){accounts=structuredClone(initial);persist();render()}}render();
</script></body></html>
